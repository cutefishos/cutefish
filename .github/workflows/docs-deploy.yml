name: Update website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.repository == 'cutefishos/cutefish'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website deploy
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          WEBSITE_REPO: ${{ secrets.WEBSITE_REPO }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WEBSITE_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$WEBSITE_REPO/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
